<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Günlük Görünüm - DietCok</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="container">
            <h1><span style="color: #28a745;">Diet</span><span style="color: #dc3545;">Cok</span> <span
                    style="color: #28a745; font-size: 0.8em;">▼</span><span
                    style="color: #dc3545; font-size: 0.8em;">▲</span></h1>
            <nav>
                <a th:href="@{/dashboard}">Ana Sayfa</a>
                <a th:href="@{/profile}">Profil</a>
                <form th:action="@{/logout}" method="post" class="logout-form"><button type="submit" class="btn-logout">Çıkış Yap</button></form>
            </nav>
        </div>
    </header>

    <div class="container">

        <div class="daily-title-row">
            <a href="/dashboard" class="back-btn" title="Geri Dön">&larr;</a>
            <h2 style="margin:0;" th:text="'Günlük Özet: ' + ${date}">Günlük Görünüm</h2>
        </div>

        <div th:if="${success}" class="success" th:text="${success}"></div>
        <div th:if="${error}" class="error" th:text="${error}"></div>

        <div class="summary-card" th:classappend="${isOverLimit} ? 'over-limit' : 'on-track'">
            <div style="display: flex; gap: 40px; align-items: center; flex-wrap: wrap;">

                <div>
                    <div class="summary-label">Kalori</div>
                    <div class="summary-stat-big" th:text="${totalCalories}">0</div>
                    <div class="summary-label" style="opacity:0.8;">kcal</div>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="macro-stat">
                        <div class="macro-val" th:text="${totalProtein}">0</div>
                        <div class="macro-label">Protein (g)</div>
                    </div>
                    <div class="macro-stat">
                        <div class="macro-val" th:text="${totalCarbs}">0</div>
                        <div class="macro-label">Karbonhidrat (g)</div>
                    </div>
                    <div class="macro-stat">
                        <div class="macro-val" th:text="${totalFat}">0</div>
                        <div class="macro-label">Yağ (g)</div>
                    </div>
                </div>

            </div>

            <div style="text-align:right;">
                <div style="font-size:3em;">
                    <span th:if="${isOverLimit}">⚠️</span>
                    <span th:unless="${isOverLimit}">🔥</span>
                </div>
                <div style="font-weight:bold; font-size:1.2em;" th:text="${isOverLimit} ? 'Hedef Aşıldı' : 'Hedefte'">
                    Durum</div>
            </div>
        </div>

        <div class="add-food-card">
            <h3 style="margin-top:0; margin-bottom:20px; color:#495057;">+ Öğün Ekle</h3>
            <form th:action="@{/consumption/add}" method="post" class="modern-form">
                <input type="hidden" name="date" th:value="${date}" />

                <div class="form-group">
                    <label>Öğün Tipi</label>
                    <select name="mealType" class="form-control">
                        <option value="BREAKFAST">🍳 Kahvaltı</option>
                        <option value="LUNCH">🥗 Öğle Yemeği</option>
                        <option value="DINNER">🍲 Akşam Yemeği</option>
                        <option value="SNACK">🍎 Ara Öğün</option>
                    </select>
                </div>

                <div class="form-group" style="flex-grow: 2;">
                    <label>Besin Seçimi</label>
                    <select name="foodId" class="form-control select2-food" required>
                        <option value=""></option>
                        <option th:each="food : ${foods}" th:value="${food.id}"
                            th:text="${food.name} + ' (' + ${food.calories} + ' kcal/100g)'"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Miktar (x100g)</label>
                    <input type="number" step="0.1" min="0.1" name="amount" value="1.0" class="form-control" required />
                </div>

                <button type="submit" class="btn-add">Ekle</button>
            </form>
        </div>

        <h3 style="color:#495057; margin-bottom:20px;">Bugünün Kayıtları</h3>

        <div class="meal-grid">
            <div class="meal-card" th:each="entry : ${groupedConsumptions}">

                <div class="meal-header">
                    <h3 th:switch="${entry.key.name()}">
                        <span th:case="'BREAKFAST'">🍳 Kahvaltı</span>
                        <span th:case="'LUNCH'">🥗 Öğle Yemeği</span>
                        <span th:case="'DINNER'">🍲 Akşam Yemeği</span>
                        <span th:case="'SNACK'">🍎 Ara Öğün</span>
                    </h3>
                    <span class="meal-total" th:text="${mealTotals.get(entry.key)} + ' kcal'">
                        0 kcal
                    </span>
                </div>

                <div th:if="${#lists.isEmpty(entry.value)}" style="color:#cbd5e0; font-style:italic; padding:10px 0;">
                    Bu öğün için kayıt yok.
                </div>

                <table class="compact-table" th:unless="${#lists.isEmpty(entry.value)}">
                    <thead>
                        <tr>
                            <th>Besin</th>
                            <th>Miktar</th>
                            <th>Kalori</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${entry.value}">
                            <td style="font-weight:500;" th:text="${c.food.name}"></td>
                            <td th:text="${c.amount} + ' x 100g'"></td>
                            <td style="font-weight:bold; color:#28a745;"
                                th:text="${#numbers.formatInteger(c.food.calories * c.amount, 0)}"></td>
                            <td style="text-align:right;">
                                <form th:action="@{/consumption/{id}/delete(id=${c.id})}" method="post" class="delete-form">
                                    <input type="hidden" name="date" th:value="${date}" />
                                    <button type="submit" class="delete-btn" aria-label="Besin kaydını sil">&times;</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
        $(document).ready(function () {
            $('.select2-food').select2({
                placeholder: "Besin aramak için yazın...",
                allowClear: true,
                width: '100%'
            });
        });
    </script>

</body>

</html>
